
name: DSO303 Docker CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dso303-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-build:
    name: Build Backend and Frontend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: dso303-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: dso303-frontend:ci

  publish-backend:
    name: Publish and Deploy Backend
    runs-on: ubuntu-24.04
    needs: docker-build

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/dso303-assignment2-backend:latest
            ${{ steps.login-ecr.outputs.registry }}/dso303-assignment2-backend:${{ github.sha }}

      - name: Deploy Backend to EC2 Auto Scaling Group
        env:
          ASG_NAME: ${{ vars.AWS_API_ASG_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "$ASG_NAME" ]; then
            echo "::error::AWS_API_ASG_NAME is missing"
            exit 1
          fi

          ASG=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0]' \
            --output json)

          LT_ID=$(echo "$ASG" | jq -r '.LaunchTemplate.LaunchTemplateId')
          LT_VERSION=$(echo "$ASG" | jq -r '.LaunchTemplate.Version')

          if [ -z "$LT_ID" ] || [ "$LT_ID" = "null" ]; then
            echo "::error::Launch template ID not found"
            exit 1
          fi

          if ! [[ "$LT_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Expected a numbered launch template version"
            exit 1
          fi

          # Read the existing bootstrap script.
          aws ec2 describe-launch-template-versions \
            --launch-template-id "$LT_ID" \
            --versions "$LT_VERSION" \
            --query 'LaunchTemplateVersions[0].LaunchTemplateData.UserData' \
            --output text > /tmp/userdata.b64

          # Replace both Docker image references with the new SHA.
          python3 - <<'PY'
          import base64
          import os
          import re

          with open("/tmp/userdata.b64") as f:
              encoded = f.read().strip()

          script = base64.b64decode(encoded).decode("utf-8")
          tag = os.environ["IMAGE_TAG"]

          script, count = re.subn(
              r'(\$ECR_REPOSITORY:)[A-Za-z0-9._-]+',
              lambda match: match.group(1) + tag,
              script
          )

          if count != 2:
              raise SystemExit(
                  f"Expected 2 Docker image references; found {count}"
              )

          with open("/tmp/new-userdata.b64", "w") as f:
              f.write(base64.b64encode(script.encode()).decode())
          PY

          # Override only user data, inheriting all other settings.
          jq -n --rawfile userdata /tmp/new-userdata.b64 \
            '{UserData: ($userdata | gsub("\\n"; ""))}' \
            > /tmp/launch-template-override.json

          NEW_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-id "$LT_ID" \
            --source-version "$LT_VERSION" \
            --launch-template-data file:///tmp/launch-template-override.json \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)

          echo "Created launch template version $NEW_VERSION"

          # Wait until any previous instance refresh finishes.
          for i in $(seq 1 60); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "Previous instance refresh: $STATUS"

            case "$STATUS" in
              Pending|InProgress|Cancelling|RollbackInProgress|Baking)
                sleep 30
                ;;
              *)
                break
                ;;
            esac

            if [ "$i" -eq 60 ]; then
              echo "::error::Previous instance refresh did not finish"
              exit 1
            fi
          done

          # DesiredConfiguration is required for automatic rollback.
          DESIRED_CONFIG=$(jq -nc \
            --arg id "$LT_ID" \
            --arg version "$NEW_VERSION" \
            '{LaunchTemplate:{LaunchTemplateId:$id,Version:$version}}')

          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --desired-configuration "$DESIRED_CONFIG" \
            --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":200,"InstanceWarmup":180,"AutoRollback":true}'

          echo "Waiting for backend deployment to finish..."

          REFRESH_ID=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$ASG_NAME" \
            --query 'InstanceRefreshes[0].InstanceRefreshId' \
            --output text)

          for i in $(seq 1 60); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Successful)
                echo "Backend deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|RollbackSuccessful|RollbackFailed)
                echo "::error::Backend deployment ended with status $STATUS"
                exit 1
                ;;
            esac

            sleep 30
          done

          echo "::error::Backend deployment verification timed out"
          exit 1

  deploy-frontend:
    name: Deploy React Frontend
    runs-on: ubuntu-24.04
    needs: docker-build

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React Frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Validate AWS Deployment Variables
        env:
          FRONTEND_BUCKET: ${{ vars.AWS_FRONTEND_BUCKET }}
          CLOUDFRONT_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "$FRONTEND_BUCKET" ] || [ -z "$CLOUDFRONT_ID" ]; then
            echo "::error::Frontend deployment variables are missing"
            exit 1
          fi

      - name: Upload Frontend to S3
        env:
          FRONTEND_BUCKET: ${{ vars.AWS_FRONTEND_BUCKET }}
        run: |
          aws s3 sync frontend/dist/ "s3://$FRONTEND_BUCKET/" --delete

      - name: Invalidate CloudFront Cache
        env:
          CLOUDFRONT_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/*"

